server.port=${PORT:8080}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/nihongo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.sql.init.mode=never
nihongo.catalog.import-on-startup=${IMPORT_DATA:true}

# Bounded pool for Neon serverless compute. Secrets are injected at runtime.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=60000
spring.flyway.url=${MIGRATION_DATABASE_URL:${spring.datasource.url}}
spring.flyway.user=${DATABASE_USERNAME:sa}
spring.flyway.password=${DATABASE_PASSWORD:}
